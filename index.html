    <meta name="theme-color" content="#060413" />

    <meta property="og:image:width" content="1200" />

        "@context": "https://schema.org",

        "name": "Setobox",
        "alternateName": "姬顶盒",
        "url": "https://setobox.me",
        "image": "https://setobox.me/img/avatar.jpg",

          "https://github.com/setobox",
          "https://space.bilibili.com/8638330",
          "https://blog.setobox.me"
        ],
        "jobTitle": "Frontend Developer",
        "worksFor": {
          "@type": "Organization",
          "name": "Independent"
        },
        "knowsAbout": [
          "Vue",
          "TypeScript",
          "GSAP",
          "Frontend Development",
          "Web Animation",
          "UnoCSS",
          "Vite"
        ],
        "birthDate": "2000-06-12",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Shanghai",
